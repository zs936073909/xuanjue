<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="玄决 —— 以传统术数为文化视角，帮你梳理问题、记录判断、回看决策的个人工具。不预测，不替你做决定。">
<meta name="theme-color" content="#1F1E1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄决">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>玄决 · 把问题想清楚，把判断留下来</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="network-bar" class="network-bar hidden">离线模式</div>
  <!-- 启动/免责声明 -->
  <div id="screen-disclaimer" class="screen">
    <div class="splash">
      <div class="splash-title">玄决</div>
      <div class="splash-sub">传统术数视角的个人梳理工具</div>
    </div>
    <div class="card disclaimer-card">
      <h3>使用须知与免责声明</h3>
      <div class="disclaimer-text">
        <p>本工具以传统术数为文化视角，用于自我梳理与记录：帮你把问题说清、留下自己的判断、到期回来看。</p>
        <p>它不预测现实，也不替你做决定。盘面事实、传统解释与反思提示分层呈现，传统说法不等于对现实的判定。</p>
        <p>不构成医疗、法律、投资等专业建议。涉及重大事项，请以可核实的现实信息与专业人士意见为准。</p>
        <p>所有数据默认保存在本机，可导出与清除，不上传服务器。</p>
      </div>
      <label class="check-line"><input type="checkbox" id="agreeCheck"> 我已阅读并同意上述声明</label>
      <button class="btn primary block" id="btnEnter" disabled>进入应用</button>
      <button class="btn ghost block mt8" id="btnSkipGate" type="button">先逛逛，稍后再说</button>
      <div class="gate-note">不同意也不影响使用：应用所有数据默认只存在本机。声明全文可随时在「我的 → 关于与免责声明」查看。</div>
    </div>
  </div>

  <!-- 主界面 -->
  <main id="main" class="hidden">
    <div id="page-container"></div>
    <nav class="tabbar" aria-label="主导航">
      <div class="tab" data-tab="home" role="button" tabindex="0"><div class="tab-ico" aria-hidden="true">问</div><div class="tab-txt">问事</div></div>
      <div class="tab" data-tab="ask" role="button" tabindex="0"><div class="tab-ico" aria-hidden="true">◷</div><div class="tab-txt">复盘</div></div>
      <div class="tab" data-tab="classics" role="button" tabindex="0"><div class="tab-ico" aria-hidden="true">书</div><div class="tab-txt">典籍</div></div>
      <div class="tab" data-tab="me" role="button" tabindex="0"><div class="tab-ico" aria-hidden="true">◐</div><div class="tab-txt">我的</div></div>
    </nav>
  </main>
</div>

<div id="modal-root"></div>
<div id="lock-screen" class="hidden"></div>
<div id="toast" class="toast"></div>
<div class="app-progress" id="appProgress"><i></i></div>

<script defer src="js/lunar.js"></script>
<script defer src="js/huangli.js"></script>
<script defer src="js/daliuren.js"></script>
<!-- 真太阳时/夏令时校正 + 格局库：shushu.js 运行时依赖，须在其之前 -->
<script defer src="js/ziwei-solar.js"></script>
<script defer src="js/ziwei-patterns.js"></script>
<script defer src="js/hehun.js"></script>
<script defer src="js/shushu.js"></script>
<script defer src="js/store.js"></script>
<!-- 问事档案数据层：v1→v2 迁移、到期判定、本机统计、导出（无 DOM，可单测） -->
<script defer src="js/decision.js"></script>
<!-- 云同步须在 Store 之后加载（localPayload/mergeIntoLocal 依赖 Store），app.js 之前 -->
<script defer src="js/cloud.js"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/classics.js"></script>
<script defer src="js/cross.js"></script>
<script defer src="js/vendor-loader.js"></script>
<script defer src="js/startup.js"></script>
<script defer src="js/bio-unlock.js"></script>
<script defer src="js/app.js"></script>
<!-- 桌面鼠标拖尾：独立装饰模块，仅细指针 + 非 reduced-motion 才激活（见 js/pointer-fx.js 门禁） -->
<script defer src="js/pointer-fx.js"></script>
</body>
</html>
